[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
# 真实链路单次 run() 实测约 1000s（见接口说明第 9 节），超时留足余量
timeout = 1200

markers =
    smoke: 冒烟用例，主干链路可用性
    contract: 输出契约用例，字段 / 引用 / 错误码
    safety: 安全对抗用例，越狱、超长输入、注入
    adversarial: 对抗用例集，第 2 周由 B 补充
    slow: 慢用例，CI 可用 -m "not slow" 跳过
