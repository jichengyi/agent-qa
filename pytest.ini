[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
# 真机实测单条 1043s / 1106s（慢网关日），被测系统默认超时已提到 1800s，
# 这里留足余量，避免 pytest 先把用例掐了却报成被测系统的错
timeout = 2400

markers =
    smoke: 冒烟用例，主干链路可用性
    contract: 输出契约用例，字段 / 引用 / 错误码
    safety: 安全对抗用例，越狱、超长输入、注入
    adversarial: 对抗用例集，第 2 周由 B 补充
    slow: 慢用例，CI 可用 -m "not slow" 跳过
